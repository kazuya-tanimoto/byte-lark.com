# この repo 固有の firewall 許可先（init-firewall.sh が起動時に読む）。
# 書式: 1 行 1 ドメイン（A レコードを解決して許可）。
#       `cidr-url <URL>` は CIDR リスト（1 行 1 CIDR）を取得してレンジごと許可。
#       `#` 以降はコメント。
# 注意: ドメイン行は「起動時に解決した IP」だけを許可する方式のため、
#       CDN の IP 回転に弱い。CDN 配下のサービスは可能なら公式 IP レンジ
#       （cidr-url）で許可すること（docs/devcontainer-plan.md §8）。

# yarn 4（corepack の yarn 本体取得 + npm ミラー）
registry.yarnpkg.com
repo.yarnpkg.com

# GitHub raw（公式雛形・skill 等の取得。meta の 185.199.108.0/22 にも含まれるが明示追加で担保）
raw.githubusercontent.com

# Playwright ブラウザ再取得（バージョン更新時。初回は firewall 適用前の postCreate で取得）
cdn.playwright.dev
playwright.download.prss.microsoft.com

# CF preview（*.workers.dev の疎通確認用）。CF 全レンジ（cidr-url https://www.cloudflare.com/ips-v4）
# の許可は、CF 配下に移った example.com（2026-07-18 実測）まで通してしまい自己検証と両立しない
# ため撤回。使うホストだけドメイン解決で許可する。
# 注意: CF のエッジ IP は多数のサイトで共有されるため、これでも完全な出口制限にはならない
# ブランチ別 alias（<branch>-byte-lark....workers.dev）は下記と同じエッジ IP に解決されるため
# 個別追加は不要（2026-08-10 実測：一覧に無い alias でも疎通した）
byte-lark.tanimoto-a49.workers.dev

# 本番ドメイン（scripts/health-check.sh の動作確認・公開後の実測用）
byte-lark.com

# ドキュメント参照
docs.astro.build
developers.cloudflare.com

# 障害の切り分け（CI が npm / GitHub 側の不調で落ちた時の一次情報）。
# どちらも Statuspage 配下で起動時解決 IP が回転し得る（本ファイル冒頭の注意）
status.npmjs.org
www.githubstatus.com

# 技術記事の参照（本文取得のみ）。zenn.dev は Cloudflare、qiita.com は CloudFront 配下で
# 起動時解決 IP が回転し得る（本ファイル冒頭の注意）。読めなくなったら ccd 再起動で再解決する
zenn.dev
qiita.com

# サイトが読み込む解析スクリプト（E2E 実行時のアクセス先）
plausible.io

# カバー画像生成（tools/imagegen。PHASE1E-004 でコンテナ内実行に対応）
# pypi 2 つは pip の依存取得先、googleapis は Gemini API 本体。
# いずれも CDN 配下で起動時解決 IP が回転し得る（本ファイル冒頭の注意）。
# 生成が connect error で落ちたら ccd 再起動で再解決する
pypi.org
files.pythonhosted.org
generativelanguage.googleapis.com
