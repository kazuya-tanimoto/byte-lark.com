version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 10
    # セキュリティ更新は常に既定ブランチ（main）を見るため、この指定はバージョン更新にだけ効く
    target-branch: "main"
    labels:
      - "dependencies"
      - "security"
    # 個別に PR が乱立しないよう、通常のバージョン更新は 1 本にまとめる。
    # メジャーは影響が大きいので、まとめずに個別の PR で受ける
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
