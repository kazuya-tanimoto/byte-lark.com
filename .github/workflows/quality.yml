name: Quality Checks
on:
  # 短命ブランチへの push では走らせない。PR が開いている間は push と pull_request の
  # 両方が発火して同じコミットに check-run が 2 本ずつ付いていた（PR #39 で実測）。
  # 検査は pull_request 側に寄せる：こちらは main とマージした結果（merge ref）を見るので
  # ブランチ単体を見る push 側より強く、必須チェックを最新に保つ設定も無効にしてある。
  # 作業ブランチの CI は「最初の push の直後に draft PR を作る」ことで受ける（README §10.4）
  push:
    branches: [main]
  # dependabot/* や archive/* は push フィルタに入らないため、この trigger が唯一の検査経路
  pull_request:
    branches: [main]

# GITHUB_TOKEN を読み取り専用に固定
permissions:
  contents: read

# 同一 ref で新しい push が来たら進行中の古い run を打ち切る（ui-tests.yml と同じ扱い）
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Lint (Biome)
        run: yarn check
      - name: Typecheck (Astro)
        run: yarn check:ts
      - name: Unit tests (Vitest)
        run: yarn test:run
      - name: Build
        run: yarn build
      # 配信しているフォントは「サイトに出てくる字だけ」に絞ってある（PHASE1D-010）。
      # 記事を足したのに `yarn fonts` を回し忘れると、新しく出てきた字だけが
      # 端末任せの書体で描かれる。組み上がった HTML と収録字を突き合わせてここで止める
      - name: Font coverage
        run: yarn fonts:check
      # 依存の脆弱性を push 時点で検知する（PHASE1D-011）。
      # GitHub の Dependabot は既定ブランチ（main）しか走査しないため、
      # feat/* に積み上げた依存は main マージまで誰も見ない状態だった。
      # ゲートは本番に入る依存の high 以上に絞る（dev 専用の勧告で赤くしない）。
      # 更新で直せない勧告が high で出た場合だけ --ignore に勧告 ID を理由付きで並べ、
      # GitHub 側で dismiss した内容と 1 対 1 に保つ（現時点では該当なし）。
      - name: Audit dependencies
        run: yarn npm audit --all --recursive --severity high --environment production
