name: Quality Checks
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable corepack(yarn v4)
        run: corepack enable
      - name: Install dependencies
        run: yarn
      - name: Lint (biome)
        run: yarn check
      - name: Typecheck
        run: yarn check:ts
      - name: Unit tests
        run: yarn test:run
      - name: Build
        run: yarn build
