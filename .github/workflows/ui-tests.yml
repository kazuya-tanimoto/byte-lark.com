name: UI Tests
on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main, "feat/*"]

# GITHUB_TOKEN を読み取り専用に固定（アーティファクトのアップロードに追加権限は不要）
permissions:
  contents: read

# 同一 ref で新しい push が来たら進行中の古い run を打ち切る（runner 時間の無駄を防ぐ）
concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # 公式 Playwright コンテナ（ブラウザ + OS 依存を内蔵）。
    # これにより runtime の `playwright install --with-deps`（apt 実行）が不要になり、
    # Ubuntu 24.04(noble) 上で apt がハングしてジョブが timeout する問題を回避する。
    # タグは @playwright/test の解決バージョン(1.62.1)と一致させること。
    # Dependabot は package.json しか更新しないのでこのタグは手で合わせる。
    # ずれるとブラウザ実体が無く e2e が全件 fail する（PHASE1D-012 で実際に発生）。
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build
        run: yarn build
      - name: Run Playwright tests
        run: yarn test:e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
