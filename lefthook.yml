pre-commit:
  parallel: true
  commands:
    biome:
      glob:
        - "*.{ts,tsx,astro,js,jsx,json,md}"
        - "**/*.{ts,tsx,astro,js,jsx,json,md}"
      run: npx biome check --no-errors-on-unmatched {staged_files}

pre-push:
  parallel: false
  commands:
    typecheck:
      run: yarn check:ts
    vitest:
      run: yarn test:run
